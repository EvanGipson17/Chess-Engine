[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-engine"
version = "0.1.0"
description = "A UCI chess engine in pure Python"
requires-python = ">=3.9"
authors = [{ name = "Evan Gipson" }]

[project.scripts]
chess-engine = "chess_engine.__main__:main"

[tool.setuptools]
packages = ["chess_engine"]
